name: bruce_omukoko_portfolio
description: "Bruce Omukoko's portfolio"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.1 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  intl: ^0.18.0
  url_launcher: ^6.2.5
  auto_size_text: ^3.0.0
  flutter_svg: ^2.0.7
  rive: ^0.13.1
  hexcolor: ^3.0.1
  get_it:
#  duration_picker:
  scrollable_positioned_list: ^0.3.8
  loading_animation_widget: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
  flutter_lints: ^3.0.0
flutter:
  uses-material-design: true
  assets:
    - bruc3balo/assets/
  fonts:
    - family: Inter
      fonts:
        - asset: bruc3balo/fonts/Inter-400.ttf
        - asset: bruc3balo/fonts/Inter-600.ttf
          weight: 600
        - asset: bruc3balo/fonts/Inter-700.ttf
          weight: 700
    - family: RobotoMono
      fonts:
        - asset: bruc3balo/fonts/RobotoMono-400.ttf
        - asset: bruc3balo/fonts/RobotoMono-600.ttf
          weight: 600
        - asset: bruc3balo/fonts/RobotoMono-700.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: bruc3balo/fonts/Poppins-700.ttf
          weight: 700
    - family: ABeeZee
      fonts:
        - asset: bruc3balo/fonts/ABeeZee-400.ttf
    - family: LovedByTheKing
      fonts:
        - asset: bruc3balo/fonts/LovedByTheKing-400.ttf
