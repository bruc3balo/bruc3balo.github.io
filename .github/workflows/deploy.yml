name: Deploy to GitHub Pages

on:
  push:
    branches: [ speed-improvements ]
  pull_request:
    branches: [ main, speed-improvements ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.5'

      - name: Install Jaspr CLI
        run: dart pub global activate jaspr_cli 0.23.5

      - name: Get dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Build static site
        run: jaspr build

      - name: Drop build tooling files
        # The site has no client-side Dart, so nothing under packages/ is loaded by the pages.
        run: rm -rf build/jaspr/packages

      - name: Report page weight
        run: |
          find build/jaspr -type f -printf '%s\t%p\n' | sort -rn | head -25
          du -sh build/jaspr
          echo "Script tags in index.html:"
          grep -o '<script[^>]*>' build/jaspr/index.html || true

      - name: Add CNAME
        run: echo "bruc3balo.github.io" > build/jaspr/CNAME

      - name: Upload preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site/build/jaspr

      - name: Deploy
        if: github.ref == 'refs/heads/speed-improvements' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/build/jaspr
          force_orphan: true
